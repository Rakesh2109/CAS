<svg xmlns="http://www.w3.org/2000/svg" width="850" height="420" viewBox="0 0 850 420" font-family="Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#404040"/>
    </marker>
    <marker id="arrowdash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b06a00"/>
    </marker>
  </defs>

  <!-- Row 1 -->
  <rect x="40" y="40" width="160" height="70" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.3"/>
  <text x="120" y="70" text-anchor="middle" font-size="12">CICIoMT2024 flows</text>
  <text x="120" y="86" text-anchor="middle" font-size="12">22 numeric features</text>

  <rect x="240" y="40" width="160" height="70" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.3"/>
  <text x="320" y="70" text-anchor="middle" font-size="12">Quantile binarization</text>
  <text x="320" y="86" text-anchor="middle" font-size="12">thermometer bits</text>

  <rect x="440" y="40" width="160" height="70" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.3"/>
  <text x="520" y="70" text-anchor="middle" font-size="12">Weighted TM</text>
  <text x="520" y="86" text-anchor="middle" font-size="12">6 &#215; 400 clauses</text>

  <rect x="640" y="40" width="170" height="70" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.3"/>
  <text x="725" y="70" text-anchor="middle" font-size="12">Clause activations</text>
  <text x="725" y="86" text-anchor="middle" font-size="11.5">n &#215; 2400 binary matrix</text>

  <line x1="200" y1="75" x2="238" y2="75" stroke="#404040" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="400" y1="75" x2="438" y2="75" stroke="#404040" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="600" y1="75" x2="638" y2="75" stroke="#404040" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- down connector -->
  <line x1="725" y1="110" x2="725" y2="188" stroke="#404040" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- Row 2 -->
  <rect x="640" y="190" width="170" height="70" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.3"/>
  <text x="725" y="216" text-anchor="middle" font-size="12">CPSS per family</text>
  <text x="725" y="232" text-anchor="middle" font-size="11.5">stability threshold, sign split</text>

  <rect x="280" y="190" width="300" height="70" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.3"/>
  <text x="430" y="216" text-anchor="middle" font-size="12">Signed signatures</text>
  <text x="430" y="232" text-anchor="middle" font-size="12">evidence for / evidence against</text>

  <rect x="40" y="190" width="200" height="70" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.3"/>
  <text x="140" y="216" text-anchor="middle" font-size="12">Attribution</text>
  <text x="140" y="232" text-anchor="middle" font-size="12">best-matching family</text>

  <line x1="638" y1="225" x2="582" y2="225" stroke="#404040" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="278" y1="225" x2="242" y2="225" stroke="#404040" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- Certificates bar -->
  <rect x="40" y="330" width="770" height="50" rx="10" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.3" stroke-dasharray="5,3"/>
  <text x="425" y="360" text-anchor="middle" font-size="12">Certificates: Shah&#8211;Samworth E[V] bound (error control)&#160;&#160;&#183;&#160;&#160;t-disjunct identifiability (mixture decoding)</text>

  <line x1="725" y1="260" x2="725" y2="328" stroke="#b06a00" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrowdash)"/>
  <line x1="430" y1="260" x2="430" y2="328" stroke="#b06a00" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrowdash)"/>
</svg>
