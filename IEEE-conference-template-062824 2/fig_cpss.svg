<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1350 560" font-family="DejaVu Serif, Times, serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <style>
    .lbl  { font-size: 12.5px; text-anchor: middle; fill: #111827; }
    .lbl2 { font-size: 11px; text-anchor: middle; fill: #1f2937; }
    .edge { stroke: #374151; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
    .elabel { font-size: 11px; fill: #374151; font-style: italic; }
  </style>

  <rect x="0" y="0" width="1350" height="560" fill="white"/>

  <!-- loop dashed container -->
  <rect x="210" y="35" width="490" height="110" rx="10" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="225" y="50" font-size="11" fill="#6b7280" text-anchor="start">repeat B times &#8594; 2B half-fits total</text>

  <!-- Row 1 -->
  <rect x="20" y="60" width="170" height="70" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text class="lbl" x="105" y="90">Clause activations Z</text>
  <text class="lbl2" x="105" y="107">one-vs-rest for family l</text>

  <rect x="230" y="60" width="190" height="70" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text class="lbl" x="325" y="90">Complementary split</text>
  <text class="lbl2" x="325" y="107">half &#8594; 2 halves</text>

  <rect x="460" y="60" width="220" height="70" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text class="lbl" x="570" y="90">kappa-grid logistic fit</text>
  <text class="lbl2" x="570" y="107">6 pts, 0.001-0.1; any-kappa selects</text>

  <rect x="720" y="60" width="200" height="70" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text class="lbl" x="820" y="90">2B half-fit votes</text>
  <text class="lbl2" x="820" y="107">pi-hat_j = selection fraction</text>

  <!-- Diamond E -->
  <polygon points="1040,45 1140,95 1040,145 940,95" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text class="lbl2" x="1040" y="92">pi-hat_j &#8805;</text>
  <text class="lbl2" x="1040" y="106">pi_thr ?</text>

  <!-- Discard F -->
  <rect x="1180" y="70" width="140" height="50" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text class="lbl2" x="1250" y="91">Discard</text>
  <text class="lbl2" x="1250" y="105">clause dropped</text>

  <!-- Diamond G (recentered) -->
  <polygon points="670,250 770,300 670,350 570,300" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text class="lbl2" x="670" y="297">mean coef_j</text>
  <text class="lbl2" x="670" y="311">&gt; 0 ?</text>

  <!-- H: S_l+ -->
  <rect x="330" y="370" width="220" height="60" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
  <text class="lbl" x="440" y="396">S_l+</text>
  <text class="lbl2" x="440" y="413">inculpatory evidence</text>

  <!-- I: S_l- -->
  <rect x="800" y="370" width="220" height="60" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text class="lbl" x="910" y="396">S_l-</text>
  <text class="lbl2" x="910" y="413">exculpatory evidence</text>

  <!-- Final band J -->
  <rect x="280" y="470" width="790" height="60" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
  <text class="lbl" x="675" y="495" font-weight="bold">Signed signature S_l = (S_l+, S_l-)</text>
  <text class="lbl2" x="675" y="513">&#8594; attribution score s_l(x)</text>

  <!-- Row1 arrows -->
  <path class="edge" d="M190,95 L230,95"/>
  <path class="edge" d="M420,95 L460,95"/>
  <path class="edge" d="M680,95 L720,95"/>
  <path class="edge" d="M920,95 L940,95"/>

  <!-- E -> F (No) -->
  <path class="edge" d="M1140,95 L1180,95"/>
  <text class="elabel" x="1160" y="87">No</text>

  <!-- E -> G (Yes), elbow down then left -->
  <path class="edge" d="M1040,145 L1040,200 L670,200 L670,250"/>
  <text class="elabel" x="1052" y="192">Yes</text>

  <!-- G -> H (Yes) -->
  <path class="edge" d="M570,300 L440,300 L440,370"/>
  <text class="elabel" x="490" y="293">Yes</text>

  <!-- G -> I (No) -->
  <path class="edge" d="M770,300 L910,300 L910,370"/>
  <text class="elabel" x="830" y="293">No</text>

  <!-- H -> J, I -> J -->
  <path class="edge" d="M440,430 L440,470"/>
  <path class="edge" d="M910,430 L910,470"/>
</svg>
